<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Inventory & Stock Management</title>
<style>
:root{
  --bg:#f1f5f9;--panel:#fff;--text:#0f2033;--muted:#71829a;--line:#e6ecf3;
  --nav:#0b1324;--blue:#0f766e;--blue2:#115e59;--green:#16a34a;--amber:#d97706;
  --orange:#ea580c;--red:#dc2626;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -12px rgba(15,23,42,.16);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:
  radial-gradient(1200px 600px at 100% -10%,rgba(15,118,110,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(234,88,12,.08),transparent 60%),
  var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login-screen{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 600px at 20% 0%,#134e4a,transparent 60%),linear-gradient(135deg,#071018,#0f2c33 55%,#0b1324);padding:20px}
.login-card{width:min(440px,94vw);background:#fff;border-radius:24px;padding:36px;box-shadow:0 40px 90px rgba(0,0,0,.35);text-align:center;border:1px solid rgba(255,255,255,.6)}
.login-card img{width:240px;height:80px;object-fit:contain}.login-card h1{margin:12px 0 4px;font-size:22px;letter-spacing:-.4px}.login-card p{color:var(--muted);margin:0 0 18px}
.form-stack{display:grid;gap:12px;text-align:left}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#5b6b83;margin-bottom:6px}
.field input,.field select,.field textarea,.search input{width:100%;padding:11px 12px;border:1px solid #dde4ee;border-radius:12px;background:#fbfdff;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:#0f766e;background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.12)}
.required::after{content:" *";color:var(--red)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;cursor:pointer;font-weight:700;text-align:center;box-shadow:0 8px 18px -8px rgba(15,118,110,.7);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}.btn:active{transform:translateY(0)}
.btn.secondary{background:#eef2f7;color:#1e293b;box-shadow:none}.btn.danger{background:linear-gradient(135deg,#b91c1c,#dc2626)}.btn.small{padding:7px 11px;font-size:12px}.btn.outline{background:transparent;border:1px dashed #cbd5e1;color:var(--blue);box-shadow:none}
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:252px;background:linear-gradient(180deg,#07131b,#0d2430 60%,#0b1324);color:#fff;padding:18px 14px;display:flex;flex-direction:column;z-index:5;border-right:1px solid rgba(255,255,255,.06)}
.brand img{width:205px;height:70px;object-fit:contain;background:#fff;border-radius:12px;padding:6px}.brand b{display:block;font-size:13px;margin:10px 4px 14px;color:#e2e8f0}
.company-chip{padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;margin-bottom:12px;font-size:11px;letter-spacing:.6px;color:#94a3b8}
.company-chip select{width:100%;background:#0b1c26;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:7px;margin-top:6px;letter-spacing:0}
.nav{display:block;width:100%;padding:10px 12px;border:0;background:transparent;color:#a9b8c9;text-align:left;border-radius:10px;margin:2px 0;cursor:pointer;font-size:14px;transition:.15s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.active{background:linear-gradient(90deg,rgba(45,212,191,.18),rgba(45,212,191,.02));color:#fff;box-shadow:inset 3px 0 0 #2dd4bf}
.sidebar-bottom{margin-top:auto}.main{margin-left:252px;flex:1;padding:24px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);border:1px solid #fff;border-radius:18px;padding:15px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:700}h1{font-size:26px;margin:4px 0;letter-spacing:-.6px}
.user-chip{font-size:13px;color:#334155;background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:999px;box-shadow:var(--shadow-sm)}
.page{display:none}.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.metric{padding:18px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.metric:hover{transform:translateY(-2px);box-shadow:0 18px 34px -18px rgba(15,23,42,.4)}
.metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#0f766e}
.metric:nth-child(2)::before{background:#0ea5e9}.metric:nth-child(3)::before{background:#16a34a}
.metric:nth-child(4)::before{background:#d97706}.metric:nth-child(5)::before{background:#6366f1}.metric:nth-child(6)::before{background:#dc2626}
.metric small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.metric strong{display:block;font-size:28px;margin:8px 0 2px;letter-spacing:-1px}
.metric span{font-size:11px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:20px;margin-top:18px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.section-head h2{margin:0;font-size:15px;letter-spacing:-.2px;text-transform:uppercase;letter-spacing:.6px;color:#334155}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:11px 12px;border-bottom:1px solid #eff3f8;text-align:left;font-size:13px;white-space:nowrap}
.table th{background:#f7fafc;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.table tr:last-child td{border-bottom:0}.table tbody tr:hover td,.table tr:hover td{background:#f9fbfd}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.a{background:#dcfce7;color:#166534}.b{background:#fef3c7;color:#92400e}.b2{background:#e0e7ff;color:#3730a3}.c{background:#fee2e2;color:#991b1b}
.notice{padding:12px 16px;border-radius:14px;background:#ecfdf5;color:#115e59;border:1px solid #ccfbf1;margin:0 0 14px;font-size:13px}
.alert-box{padding:12px 16px;border-radius:14px;background:#fff1f2;color:#991b1b;border:1px solid #fecdd3;margin-bottom:14px;font-size:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.inline{display:flex;gap:10px;align-items:end}.inline>*{flex:1}.search{display:flex;gap:10px}.search input{flex:1}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:999px;font-size:12px}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.report-paper{background:#fff;border:1px solid #dfe5ec;padding:30px;border-radius:16px;box-shadow:var(--shadow)}.report-logo{width:160px;height:55px;object-fit:contain}
.company-brand{display:flex;align-items:center;gap:12px}.company-brand h2{margin:0}.muted{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.6);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;padding:20px}
.modal-card{width:min(680px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 40px 90px rgba(0,0,0,.35)}
.toast{position:fixed;right:22px;bottom:22px;background:#0f2033;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 16px 34px rgba(0,0,0,.28);z-index:30}
.grade-box{background:linear-gradient(180deg,#f8fafc,#f1f5f9);border:1px dashed #cbd5e1;border-radius:14px;padding:14px;grid-column:span 2;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.auth-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px}
.auth-footer a{color:var(--blue);text-decoration:none;font-weight:700;cursor:pointer}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px;border:3px solid transparent;background-clip:content-box}
.hamburger{display:none;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:20px;line-height:1;padding:8px 12px;cursor:pointer}
.nav-scrim{display:none;position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:4}
.nav-scrim.show{display:block}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  .hamburger{display:block}
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;width:264px;box-shadow:0 0 40px rgba(0,0,0,.4);overflow-y:auto}
  .sidebar.open{transform:none}
  .main{margin-left:0;padding:14px}
  .topbar{gap:12px;padding:12px 14px;border-radius:16px;flex-wrap:wrap}
  .tb-title{flex:1;min-width:0}
  .tb-title h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-chip{font-size:11px;padding:7px 10px;order:3;width:100%;text-align:center}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .metric{padding:14px}.metric strong{font-size:22px}
  .two,.form-grid{grid-template-columns:1fr}
  .grade-box{grid-column:span 1;grid-template-columns:1fr 1fr}
  .panel{padding:14px;border-radius:16px}
  .section-head{flex-direction:column;align-items:flex-start}
  .table th,.table td{padding:9px 10px;font-size:12px}
  .btn{padding:12px 14px}
  .actions .btn,.filter-bar .btn{flex:1 1 auto;min-width:120px}
  .inline{flex-direction:column;align-items:stretch}
  .filter-bar>*{flex:1 1 140px}
  .report-paper{padding:16px}
  .modal{padding:10px}.modal-card{padding:16px;border-radius:16px}
  .toast{right:12px;left:12px;bottom:12px;text-align:center}
  .field input,.field select,.field textarea{font-size:16px}
}
@media(max-width:420px){.cards{grid-template-columns:1fr}.grade-box{grid-template-columns:1fr 1fr}}

.print-only{display:none}
.report-meta{text-align:right;font-size:12px;color:#334155;line-height:1.6}
.report-title-box{display:inline-block;text-align:right;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:10px 14px}
.report-accent{height:3px;background:linear-gradient(90deg,#0f172a,#64748b 60%,transparent);border-radius:2px;margin:14px 0 16px}
.report-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:24px;font-size:11px;color:#475569}
.sign-line{border-top:1px dotted #64748b;padding-top:4px;min-width:190px;text-align:center}

@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important}
  body *{display:none!important}
  body *:has(#reportPaper), body *:has(#vendorReportPaper){display:block!important;background:none!important;box-shadow:none!important;border:none!important;padding:0!important;margin:0!important;width:auto!important;max-width:none!important;overflow:visible!important}
  #reportPaper, #vendorReportPaper{display:block!important;position:static!important;border:none!important;box-shadow:none!important;border-radius:0!important;padding:0!important;width:100%!important}
  #reportPaper *, #vendorReportPaper *{display:revert!important}
  #reportPaper table, #vendorReportPaper table{display:table!important;width:100%!important;border-collapse:collapse!important;font-size:10.5px!important}
  #reportPaper thead, #vendorReportPaper thead{display:table-header-group!important}
  #reportPaper tr, #vendorReportPaper tr{display:table-row!important;break-inside:avoid;page-break-inside:avoid}
  #reportPaper th, #reportPaper td, #vendorReportPaper th, #vendorReportPaper td{display:table-cell!important;border:1px solid #cbd5e1!important;padding:5px 6px!important}
  #reportPaper th, #vendorReportPaper th{background:#eef2f7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left}
  #reportPaper tbody tr:nth-child(even) td, #reportPaper tr:nth-child(even) td{background:#fafbfc!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #reportPaper tr:last-child td{border-top:3px double #0f172a!important;font-weight:700}
  #reportPaper .table-wrap, #vendorReportPaper .table-wrap{display:block!important;overflow:visible!important;border:none!important}
  #reportPaper .kpis, #vendorReportPaper .kpis{display:flex!important;flex-wrap:wrap!important;gap:6px!important;margin-bottom:10px!important}
  #reportPaper .pill, #vendorReportPaper .pill{display:inline-block!important;border:1px solid #cbd5e1!important;border-radius:4px!important;padding:4px 8px!important;font-size:10.5px!important;background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #reportPaper .pill.a{background:#eef7ee!important}#reportPaper .pill.b{background:#eef3fb!important}
  #reportPaper .pill.b2{background:#fdf6e8!important}#reportPaper .pill.c{background:#fdeeee!important}
  #reportPaper .preview-head, #vendorReportPaper .preview-head{display:flex!important;justify-content:space-between!important;align-items:flex-start!important}
  #reportPaper .company-brand, #vendorReportPaper .company-brand{display:flex!important;align-items:center!important;gap:10px!important}
  #reportPaper .report-logo, #vendorReportPaper .report-logo{display:block!important;width:150px!important;height:50px!important;object-fit:contain}
  #reportPaper .report-title-box, #vendorReportPaper .report-title-box{display:inline-block!important;border:1px solid #cbd5e1!important;background:#f6f8fb!important;border-radius:6px!important;padding:8px 10px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #reportPaper .report-accent, #vendorReportPaper .report-accent{display:block!important;height:3px!important;background:#0f172a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:12px 0 14px!important}
  #reportPaper .report-foot, #vendorReportPaper .report-foot{display:flex!important;justify-content:space-between!important;align-items:flex-end!important;margin-top:22px!important;font-size:10px!important}
  #reportPaper .sign-line, #vendorReportPaper .sign-line{display:block!important;border-top:1px dotted #475569!important;padding-top:3px!important;min-width:180px!important;text-align:center!important}
  .print-only{display:block!important}
  .sidebar, .topbar, .no-print, #loginScreen, .toast, .modal{display:none!important}
}

</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card" id="signInBox">
    <img id="loginLogo" alt="Inventory Logo">
    <h1>Stock Management</h1>
    <p id="loginSubtitle">Inventory Control Panel</p>
    <form id="loginForm" class="form-stack">
      <div class="field"><label class="required">Select Company</label><select id="loginCompanySelect" required></select></div>
      <div class="field"><label class="required">Email Address</label><input id="loginEmail" type="email" placeholder="you@example.com" required></div>
      <div class="field"><label class="required">Password</label><input id="loginPass" type="password" placeholder="••••••••" required></div>
      <div id="loginError" class="hidden" style="color:#b91c1c;font-size:12px;font-weight:600;margin-bottom:6px"></div>
      <button class="btn">Sign In</button>
    </form>
    <div class="auth-footer">
      <a onclick="toggleAuth(true)">+ Register New Company</a>
    </div>
  </div>

  <div class="login-card hidden" id="createAdminBox">
    <h1>👤 Create Admin Account</h1>
    <p>First account — full access</p>
    <form id="createAdminForm" class="form-stack">
      <div class="field"><label class="required">Full Name</label><input id="firstAdminName" placeholder="e.g. Md. Rakib Hasan" required></div>
      <div class="field"><label class="required">Position</label><input id="firstAdminPosition" placeholder="e.g. QC" required></div>
      <div class="field"><label class="required">Email Address</label><input id="firstAdminEmail" type="email" placeholder="admin@company.com" required></div>
      <div class="field"><label class="required">Password</label><input id="firstAdminPass" type="password" placeholder="••••••••" required></div>
      <button class="btn">Create & Sign In</button>
    </form>
  </div>

  <div class="login-card hidden" id="signUpCompanyBox">
    <h1>🏢 Create Company</h1>
    <p>Register a new company workspace</p>
    <form id="quickCompanyForm" class="form-stack">
      <div class="field"><label class="required">Company Name</label><input id="regCompName" placeholder="e.g. Apex Traders Ltd." required></div>
      <div class="field"><label>Company Address</label><input id="regCompAddress" placeholder="e.g. Gulshan, Dhaka"></div>
      <div class="field"><label class="required">Your Full Name</label><input id="regAdminName" placeholder="e.g. Md. Rakib Hasan" required></div>
      <div class="field"><label class="required">Your Position</label><input id="regAdminPosition" placeholder="e.g. QC" required></div>
      <div class="field"><label class="required">Admin Email</label><input id="regAdminEmail" type="email" placeholder="admin@company.com" required></div>
      <div class="field"><label class="required">Password</label><input id="regAdminPass" type="password" placeholder="••••••••" required></div>
      <button class="btn">Create & Launch</button>
      <button type="button" class="btn secondary" onclick="toggleAuth(false)">Back to Sign In</button>
    </form>
  </div>
</div>


<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><img id="brandLogo" alt="Inventory Logo"><b id="brandCompany">Loading...</b></div>
    <div class="company-chip">
      <small>ACTIVE COMPANY</small>
      <select id="sidebarCompanySelect" onchange="switchCompany(this.value)"></select>
    </div>
    <button class="nav active" data-page="dashboard">Dashboard</button>
    <button class="nav" data-page="in">Stock IN (Receive)</button>
    <button class="nav" data-page="out">Stock OUT (Dispatch)</button>
    <button class="nav" data-page="vendorReports">🏪 Vendor Reports</button>
    <button class="nav" data-page="cartons">Carton Tracking</button>
    <button class="nav" data-page="vendors">🏷️ Vendors & Pricing</button>
    <button class="nav" data-page="products">Products</button>
    <button class="nav" data-page="reports">Stock Reports</button>
    <button class="nav admin-only" data-page="audit">📋 Audit Log</button>
    <button class="nav admin-only" data-page="backup">💾 Backup & Cloud</button>
    <button class="nav admin-only" data-page="companies">🏢 Companies</button>
    <button class="nav admin-only" data-page="company">Company Settings</button>
    <button class="nav admin-only" data-page="users">👥 Users</button>
    <div class="sidebar-bottom"><button id="logoutBtn" class="nav">Logout</button></div>
  </aside>

  <div id="navScrim" class="nav-scrim" onclick="toggleSidebar(false)"></div>
  <main class="main">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <div class="tb-title"><span class="eyebrow">INVENTORY CONTROL</span><h1 id="pageTitle">Dashboard</h1></div>
      <div class="user-chip" id="userChip">Admin · admin@example.com</div>
    </header>


    <section id="page-dashboard" class="page active"></section>
    <section id="page-in" class="page"></section>
    <section id="page-out" class="page"></section>
    <section id="page-vendorReports" class="page"></section>
    <section id="page-cartons" class="page"></section>
    <section id="page-vendors" class="page"></section>
    <section id="page-products" class="page"></section>
    <section id="page-reports" class="page"></section>
    <section id="page-audit" class="page"></section>
    <section id="page-backup" class="page"></section>
    <section id="page-companies" class="page"></section>
    <section id="page-company" class="page"></section>
    <section id="page-users" class="page"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast hidden"></div>
<datalist id="vendorSuggestions"></datalist>

<script>
const LS = "genericCartonStorage_v9";
const logoFallback = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150">
  <rect width="500" height="150" rx="16" fill="#0f172a"/>
  <path d="M45 40 L85 20 L125 40 L85 60 Z" fill="#3b82f6"/>
  <path d="M45 45 L85 65 L85 110 L45 90 Z" fill="#2563eb"/>
  <path d="M125 45 L85 65 L85 110 L125 90 Z" fill="#1d4ed8"/>
  <text x="155" y="88" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="2">INVENTORY</text>
  <text x="157" y="112" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">STOCK &amp; CARTON CONTROL</text>
</svg>`);

async function hashString(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function defaultState(){
  return {
    activeCompanyId: "c1",
    selectedVendorFilter: "ALL",
    cartonStatusFilter: "ALL",
    dateFilterFrom: "",
    dateFilterTo: "",
    companies: [
      {id:"c1", name:"My Inventory Limited", address:"Dhaka, Bangladesh", logo:""}
    ],
    user:{name:"", position:"", email:"", role:"Admin", loggedIn:false},
    users:[],
    products:[{id:"p1", companyId:"c1", name:"Sample Product Pack", retailPrice:0}],
    vendors:[],
    selectedVendorId:"",
    cartons:[],
    movements:[],
    audits:[]
  };
}

let state = migrateState(load());
function load(){try{return JSON.parse(localStorage.getItem(LS))||defaultState()}catch(e){return defaultState()}}
function migrateState(s){
  if(!s) return defaultState();
  if(!Array.isArray(s.vendors)) s.vendors = [];
  if(!Array.isArray(s.users)) s.users = [];
  if(!s.user) s.user = {name:"", position:"", email:"", role:"Admin", loggedIn:false};
  (s.products||[]).forEach(p=>{ if(p.retailPrice===undefined || p.retailPrice===null) p.retailPrice = 0; });
  (s.cartons||[]).forEach(c=>{
    const nm = String(c.outlet||"").trim();
    if(!nm) return;
    const exists = s.vendors.some(v=>v.companyId===c.companyId && String(v.name).toLowerCase()===nm.toLowerCase());
    if(!exists) s.vendors.push({id:uid("v"), companyId:c.companyId, name:nm, phone:"", address:"", discountPct:0});
  });
  return s;
}
function save(){localStorage.setItem(LS,JSON.stringify(state))}
function uid(prefix){return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function now(){return new Date().toLocaleString()}

/* ---------- Accounts ---------- */
function accountById(id){ return (state.users||[]).find(u=>u.id===id) }
function currentAccount(){ return accountById((state.user||{}).id) }
function isAdmin(){ return (state.user||{}).role === "Admin" }
function touchSeen(){
  const a=currentAccount(); if(!a) return;
  const t=Date.now();
  if(!a.lastSeenAt || t - new Date(a.lastSeenAt).getTime() > 60000){ a.lastSeenAt = new Date(t).toISOString(); save(); }
}
function enforceSession(){
  if(!state.user?.loggedIn) return true;
  const a=currentAccount();
  if(!a || a.active===false){
    forceLogout(a ? "Your account is inactive. Contact an admin." : "Your account has been removed.");
    return false;
  }
  state.user.name=a.name; state.user.position=a.position; state.user.email=a.email; state.user.role=a.role;
  return true;
}
function forceLogout(msg){
  state.user.loggedIn=false; save();
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  showAuthScreen();

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function recordAudit(action, details){

function getCompanyMovements(){ return state.movements.filter(m => m.companyId === state.activeCompanyId); }

function stockByCat(){
  const res={A:0,B:0,B2:0,C:0};
  getCompanyCartons().forEach(c=>{
    if(c.status==="IN STOCK"){
      res.A += Number(c.grades?.A || 0);
      res.B += Number(c.grades?.B || 0);
      res.B2 += Number(c.grades?.B2 || 0);
      res.C += Number(c.grades?.C || 0);
    }
  });
  return res;
}
function totalStock(){
  const s = stockByCat();
  return s.A + s.B + s.B2 + s.C;
}
function activeCartons(){return getCompanyCartons().filter(x=>x.status==="IN STOCK" && (x.pcs > 0)).length}
function getProduct(id){return state.products.find(x=>x.id===id)}

/* ---- Vendor & pricing helpers ---- */
function getCompanyVendors(){ return (state.vendors||[]).filter(v => v.companyId === state.activeCompanyId); }
function findVendorByName(name){
  const n = String(name||"").trim().toLowerCase();
  if(!n) return null;
  return (state.vendors||[]).find(v=>v.companyId===state.activeCompanyId && v.name.toLowerCase()===n) || null;
}
function vendorPct(name){ const v = findVendorByName(name); return v ? (Number(v.discountPct)||0) : 0; }
function vendorPriceFor(productId, vendorName){
  const rp = Number(getProduct(productId)?.retailPrice)||0;
  return rp * (1 - vendorPct(vendorName)/100);
}
function unitPriceFor(carton){ return vendorPriceFor(carton?.productId, carton?.outlet); }
function money(n){
  const v = Number(n)||0;
  return "৳" + v.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
}
function setProductPrice(pid, val){
  const p = state.products.find(x=>x.id===pid); if(!p) return;
  p.retailPrice = Number(val)||0;
  recordAudit("PRODUCT", `Set retail price of ${p.name} to ${p.retailPrice}`);
  save(); toast("Retail price updated.");
}
function setVendorPct(vid, val){
  const v = (state.vendors||[]).find(x=>x.id===vid); if(!v) return;
  v.discountPct = Number(val)||0;
  recordAudit("VENDOR", `Set ${v.name} discount to ${v.discountPct}%`);
  save(); toast("Vendor discount updated."); render.vendors();
}
function deleteVendor(vid){
  if(state.user.role !== "Admin") return alert("Only Admin can delete vendors!");
  const v = (state.vendors||[]).find(x=>x.id===vid); if(!v) return;
  if(!confirm(`Delete vendor '${v.name}'? Carton records will keep the name.`)) return;
  state.vendors = state.vendors.filter(x=>x.id!==vid);
  recordAudit("VENDOR", "Deleted vendor "+v.name);
  save(); updateVendorDatalist(); toast("Vendor deleted."); render.vendors();
}
function updateOutValue(){
  const box = document.getElementById("outValueBox"); if(!box) return;
  const c = state.cartons.find(x=>x.id===document.getElementById("outCartonSelect")?.value);
  const qty = Number(document.getElementById("outPcsInput")?.value)||0;
  if(!c){ box.innerHTML = `<span class="pill">Vendor Rate: -</span><span class="pill">Line Total: -</span>`; return; }

}

out(){
 const available=getCompanyCartons().filter(x=>x.status==="IN STOCK"&&x.pcs>0);
 document.getElementById("page-out").innerHTML=`
 <div class="notice">Select carton to view available breakdown (A, B, B2, C) and dispatch.</div>
 <form id="outForm" class="panel form-grid">
  <div class="field" style="grid-column:span 2"><label class="required">Select Carton (Stock Breakdown)</label>
    <select name="cartonId" id="outCartonSelect" onchange="updateOutGradeHints(this.value);updateOutValue()" required>
      <option value="">-- Choose Carton --</option>
      ${available.map(c=>`<option value="${c.id}">${esc(c.cartonNo)} | Prod: ${esc(getProduct(c.productId)?.name||"")} | Vendor: ${esc(c.outlet||"Direct")} | Rate: ${money(unitPriceFor(c))} | Total: ${c.pcs} [A:${c.grades.A}, B:${c.grades.B}, B2:${c.grades.B2}, C:${c.grades.C}]</option>`).join("")}
    </select>
  </div>
  
  <div class="field"><label class="required">Select Grade to Dispatch</label>
    <select name="grade" id="outGradeSelect" onchange="updateOutValue()" required>
      <option value="A">Grade A (Fresh)</option>
      <option value="B">Grade B (Usable)</option>
      <option value="B2">Grade B2</option>
      <option value="C">Grade C (Damage / Disposal)</option>
    </select>
  </div>

  <div class="field"><label class="required">Dispatch / OUT PCS</label><input name="pcs" id="outPcsInput" type="number" min="1" oninput="updateOutValue()" required></div>
  <div class="field"><label class="required">OUT Date</label><input name="date" type="date" value="${new Date().toISOString().split('T')[0]}" required></div>
  <div class="field"><label>Invoice / Reference</label><input name="reference" placeholder="e.g. OUT-4029"></div>
  <div class="field" style="grid-column:span 2"><label>Remarks / Purpose</label><input name="reason"></div>
  <div class="field" style="grid-column:span 2"><div class="kpis" id="outValueBox"><span class="pill">Vendor Rate: -</span><span class="pill">Line Total: -</span></div></div>
  <div class="actions"><button class="btn">Confirm Stock OUT</button></div>
 </form>`;

 document.getElementById("outForm").onsubmit=e=>{
  e.preventDefault(); const f=new FormData(e.target); 
  const c=state.cartons.find(x=>x.id===f.get("cartonId")); 
  const grade=f.get("grade");
  const qty=Number(f.get("pcs"));

  if(!c) return toast("Please select a valid carton.");
  const availableInGrade = c.grades[grade] || 0;
  if(qty > availableInGrade) return alert(`Not enough PCS in Grade ${grade}! Available right now: ${availableInGrade} PCS.`);

  c.grades[grade] -= qty;
  c.pcs -= qty;
  if(c.pcs === 0) c.status="OUT";

  state.movements.unshift({id:uid("m"),companyId:state.activeCompanyId,type:"OUT",cartonId:c.id,cartonNo:c.cartonNo,grade:grade,pcs:qty,reference:f.get("reference"),reason:f.get("reason"),date:f.get("date"),user:state.user.email});
  recordAudit("STOCK OUT", `Dispatched ${qty} PCS (Grade ${grade}) from ${c.cartonNo}`);
  save(); toast("Stock OUT recorded."); show("dashboard");
 };
},

vendorReports(){
 const compCartons = getCompanyCartons();
 const vendorNames = [...new Set(compCartons.map(c=>c.outlet||"Direct Receive"))];
 const selected = state.selectedVendorFilter || "ALL";
 const fromDate = state.dateFilterFrom || "";
 const toDate = state.dateFilterTo || "";

 const filteredCartons = compCartons.filter(c=>{
   const matchVendor = selected === "ALL" || (c.outlet||"Direct Receive") === selected;
   let matchDate = true;
   if(fromDate && c.inDate < fromDate) matchDate = false;
   if(toDate && c.inDate > toDate) matchDate = false;
   return matchVendor && matchDate;
 });

 let totalA = 0, totalB = 0, totalB2 = 0, totalC = 0, totalPcs = 0;
 let valA = 0, valB = 0, valB2 = 0, valC = 0, valTotal = 0;
 filteredCartons.forEach(c=>{
   const g = c.initialGrades || c.grades;
   const up = unitPriceFor(c);
   totalA += Number(g?.A || 0);
   totalB += Number(g?.B || 0);
   totalB2 += Number(g?.B2 || 0);
   totalC += Number(g?.C || 0);
   totalPcs += Number(c.initialPcs || c.pcs);
   valA += up * Number(g?.A || 0);
   valB += up * Number(g?.B || 0);
   valB2 += up * Number(g?.B2 || 0);
   valC += up * Number(g?.C || 0);
   valTotal += up * Number(c.initialPcs || c.pcs);
 });
 const damagePctVal = valTotal>0 ? Math.round((valC/valTotal)*1000)/10 : 0;

 reports(){
  const s=stockByCat(); const comp = currentCompany();

  const all=getCompanyCartons();
  const rows = g==="ALL" ? all : all.filter(c=>(c.grades?.[g]||0)>0);

  const btn=(k,l)=>`<button class="btn small ${g===k?'':'secondary'}" onclick="setReportGrade('${k}')">${l}</button>`;

  // ---- Value calculations (vendor rate = retail - vendor discount %) ----
  let stockValue=0, pcsTotal=0;
  const gradePcs={A:0,B:0,B2:0,C:0}, gradeVal={A:0,B:0,B2:0,C:0};
  rows.forEach(c=>{
    const up=unitPriceFor(c);
    pcsTotal += Number(c.pcs||0);

    ["A","B","B2","C"].forEach(k=>{
      const q=Number(c.grades?.[k]||0);

     <div class="company-brand">
       <img id="reportLogo" class="report-logo">
       <div><h2>${esc(comp.name)}</h2><div class="muted">${esc(comp.address||"")}</div></div>
     </div>
     ${printMeta(g==="ALL"?"Current Balance Report":"Grade "+g+" Stock Report",[])}
   </div>
   <div class="report-accent"></div>
   <div class="kpis" style="margin-bottom:12px">
     <span class="pill">${g==="ALL"?"Total":"Grade "+g} : ${gradeTotal} PCS</span>
     <span class="pill">Cartons: ${rows.length}</span>
     <span class="pill"><b>${g==="ALL"?"Total Stock Value":"Grade "+g+" Value"}: ${money(filteredValue)}</b></span>

     <span class="pill a">A: ${gradePcs.A} PCS · ${money(gradeVal.A)}</span>
     <span class="pill b">B: ${gradePcs.B} PCS · ${money(gradeVal.B)}</span>
     <span class="pill b2">B2: ${gradePcs.B2} PCS · ${money(gradeVal.B2)}</span>
     <span class="pill c">C (Damage): ${gradePcs.C} PCS · ${money(gradeVal.C)}</span>
     <span class="pill c"><b>Damage Value: ${money(gradeVal.C)}</b></span>

function deleteCompany(cid){

  if(state.companies.length <= 1) return alert("You cannot delete the only company!");
  const target = state.companies.find(c=>c.id===cid);
  if(!confirm(`⚠️ Warning: Are you sure you want to completely delete '${target?.name}' and all its data?`)) return;

  state.companies = state.companies.filter(c=>c.id !== cid);

function rollbackOutMovement(moveId){
  if(state.user.role !== "Admin") return alert("Only Admin can undo movements!");
  const move = state.movements.find(m=>m.id===moveId);
  if(!move || move.type!=="OUT") return;
  const carton = state.cartons.find(c=>c.id===move.cartonId);
  if(!carton) return alert("Carton not found!");

  if(!confirm(`Reverse this dispatch (+${move.pcs} PCS to Grade ${move.grade})?`)) return;

  carton.grades[move.grade] = (carton.grades[move.grade] || 0) + Number(move.pcs);
  carton.pcs += Number(move.pcs);
  carton.status = "IN STOCK";

  state.movements = state.movements.filter(m=>m.id!==moveId);
  recordAudit("UNDO OUT", `Reverted ${move.pcs} PCS (Grade ${move.grade}) back to ${carton.cartonNo}`);
  save(); toast("Stock OUT reverted successfully."); openCarton(carton.id); render.cartons();
}

function importFromDriveUrl(){
  const url = document.getElementById("driveImportUrl").value.trim();
  if(!url) return alert("Please enter a valid JSON link!");

  fetch(url)
    .then(res=>res.json())
    .then(imported=>{
      if(!imported.companies || !imported.cartons){
        return alert("Invalid database structure from URL!");
      }
      if(confirm("⚠️ Overwrite current database with this cloud sync data?")){
        state = imported;
        recordAudit("CLOUD SYNC", "Synced database from cloud link");
        save(); syncHeader(); setLogo(); show("dashboard");
        toast("Cloud database synced successfully!");
      }
    })
    .catch(err=>alert("Failed to fetch JSON from link: " + err.message));
}

function restoreBackupJSON(){
  const fileInput = document.getElementById("restoreFileInput");
  const file = fileInput.files[0];
  if(!file) return alert("Please select a valid JSON backup file first!");

  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.companies || !imported.cartons){
        return alert("Invalid backup file structure!");
      }
      if(confirm("⚠️ Overwrite current database with this backup file?")){
        state = imported;
        recordAudit("RESTORE", "Restored database from JSON file");
        save(); syncHeader(); setLogo(); show("dashboard");
        toast("Database restored successfully!");
      }
    }catch(err){
      alert("Error reading JSON file: " + err.message);
    }
  };
  reader.readAsText(file);
}

function relTime(iso){
  if(!iso) return "Never";
  const d=new Date(iso), diff=Date.now()-d.getTime();
  const m=Math.floor(diff/60000);
  if(m<1) return "Just now";
  if(m<60) return m+" min ago";
  const h=Math.floor(m/60); if(h<24) return h+" hr ago";
  return d.toLocaleString();
}

      recordAudit("USER", `Created ${role} account ${email}`);
    }
    save(); enforceSession(); syncHeader(); closeModal(); render.users(); toast("Account saved.");
  };
}

function toggleUserActive(id){
  if(!isAdmin()) return;
  const u=accountById(id); if(!u) return;
  if(u.id===state.user.id) return alert("You cannot deactivate your own account.");
  if(u.active!==false && u.role==="Admin" && adminCount()<=1) return alert("Cannot deactivate the last active Admin.");
  u.active = u.active===false;
  recordAudit("USER", `${u.active?"Activated":"Deactivated"} account ${u.email}`);
  save(); render.users(); toast(u.active?"Account activated.":"Account deactivated.");
}

function deleteUser(id){
  if(!isAdmin()) return;
  const u=accountById(id); if(!u) return;
  if(u.id===state.user.id) return alert("You cannot delete your own account.");
  if(u.role==="Admin" && adminCount()<=1) return alert("Cannot delete the last active Admin.");
  if(!confirm(`Delete account ${u.email}? This cannot be undone.`)) return;
  state.users = state.users.filter(x=>x.id!==id);
  recordAudit("USER", `Deleted account ${u.email}`);
  save(); render.users(); toast("Account deleted.");
}

/* ---------- Auth ---------- */
function loginError(msg){
  const el=document.getElementById("loginError");
  el.textContent=msg; el.classList.remove("hidden");
}
function showAuthScreen(){
  const first = (state.users||[]).length === 0;
  document.getElementById("createAdminBox").classList.toggle("hidden", !first);
  document.getElementById("signInBox").classList.toggle("hidden", first);
  document.getElementById("signUpCompanyBox").classList.add("hidden");
}
function enterApp(msg){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  syncHeader(); setLogo(); show("dashboard"); if(msg) toast(msg);
}
function signInAccount(a){
  const nowIso=new Date().toISOString();
  a.lastLoginAt=nowIso; a.lastSeenAt=nowIso;
  state.user={id:a.id,name:a.name,position:a.position,email:a.email,role:a.role,loggedIn:true};
  recordAudit("LOGIN", `${a.name} (${a.position}) signed in`);
  save();
}

document.getElementById("loginForm").onsubmit=async e=>{
 e.preventDefault();
 document.getElementById("loginError").classList.add("hidden");
 const email=document.getElementById("loginEmail").value.trim().toLowerCase();
 const compId=document.getElementById("loginCompanySelect").value;
 const pass=document.getElementById("loginPass").value;
 const passHash = await hashString(pass);
 const a=(state.users||[]).find(u=>u.email===email && u.passHash===passHash);
 if(!a) return loginError("Access denied. Invalid email or password.");
 if(a.active===false) return loginError("Your account is inactive.");
 state.activeCompanyId = compId || state.activeCompanyId;
 signInAccount(a);
 enterApp(`Welcome, ${a.name}!`);
};

document.getElementById("createAdminForm").onsubmit=async e=>{
 e.preventDefault();
 const name=document.getElementById("firstAdminName").value.trim();
 const position=document.getElementById("firstAdminPosition").value.trim();
 const email=document.getElementById("firstAdminEmail").value.trim().toLowerCase();
 const pass=document.getElementById("firstAdminPass").value;
 const a={id:uid("u"),name,position,email,passHash:await hashString(pass),role:"Admin",active:true,createdAt:new Date().toISOString(),lastLoginAt:null,lastSeenAt:null};
 state.users.push(a);
 signInAccount(a);
 recordAudit("USER", `First Admin account created (${email})`);
 enterApp("Admin account created.");
};

document.getElementById("quickCompanyForm").onsubmit=async e=>{
 e.preventDefault();
 const compName = document.getElementById("regCompName").value.trim();
 const compAddress = document.getElementById("regCompAddress").value.trim();
 const name = document.getElementById("regAdminName").value.trim();
 const position = document.getElementById("regAdminPosition").value.trim();
 const adminEmail = document.getElementById("regAdminEmail").value.trim().toLowerCase();
 const adminPass = document.getElementById("regAdminPass").value;
 if(!compName || !adminEmail) return;
 if((state.users||[]).some(u=>u.email===adminEmail)) return alert("This email is already registered.");

 const newCompId = uid("comp");
 state.companies.push({id:newCompId, name:compName, address:compAddress, logo:""});
 state.activeCompanyId = newCompId;
 const a={id:uid("u"),name,position,email:adminEmail,passHash:await hashString(adminPass),role:"Admin",active:true,createdAt:new Date().toISOString(),lastLoginAt:null,lastSeenAt:null};
 state.users.push(a);
 signInAccount(a);
 recordAudit("COMPANY", `Registered workspace ${compName}`);
 enterApp(`Company '${compName}' workspace ready!`);
};

syncHeader();
setLogo();
if(state.user?.loggedIn && enforceSession()){
  enterApp();
}else{
  state.user.loggedIn=false;
  document.getElementById("loginScreen").classList.remove("hidden");
  showAuthScreen();
}

</script>
</body>
</html>
