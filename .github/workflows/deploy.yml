name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make the site folder (no npm, no build)
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          cp public/app/index.html _site/index.html
          sed -i 's|href=\"\.\./apple-touch-icon\.png\"|href=\"apple-touch-icon.png\"|' _site/index.html || true
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
